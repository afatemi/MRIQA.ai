# Streamlit appearance + server settings for the deployed app.
# Anything user-secret (API keys, etc) belongs in secrets.toml, NOT here.


[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#141B26"
textColor = "#E7ECF3"
font = "sans serif"

[server]
maxUploadSize = 500
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[ui]
hideTopBar = false                  # keep Streamlit's hamburger for now (deploy / share)
